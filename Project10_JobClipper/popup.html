<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Job Clipper</title>
  <link rel="stylesheet" href="styles.css">
  <script defer src="popup.js"></script>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">JC</span>
        <div><h1>Job Clipper</h1><p>Your job search, organized.</p></div>
      </div>
      <button id="clipButton" class="button button-primary" type="button"><span aria-hidden="true">＋</span> Clip job</button>
    </header>
    <section class="toolbar" aria-label="Board tools">
      <label class="search">
        <span aria-hidden="true">⌕</span>
        <span class="sr-only">Search jobs</span>
        <input id="searchInput" type="search" placeholder="Search title or company…" autocomplete="off">
      </label>
      <button id="exportButton" class="button button-secondary" type="button">Export CSV</button>
    </section>
    <p id="statusMessage" class="status-message" role="status" aria-live="polite"></p>
    <section id="jobFormPanel" class="form-panel hidden" aria-labelledby="formTitle">
      <div class="form-heading">
        <div><p class="eyebrow">JOB DETAILS</p><h2 id="formTitle">Save a job</h2></div>
        <button id="closeFormButton" class="icon-button" type="button" aria-label="Close form">×</button>
      </div>
      <form id="jobForm">
        <div class="form-grid">
          <label>Job title <input id="jobTitle" name="title" maxlength="200" required></label>
          <label>Company <input id="jobCompany" name="company" maxlength="160" placeholder="Company name"></label>
          <label class="wide">Job URL <input id="jobUrl" name="url" type="url" maxlength="2048" placeholder="https://…" required></label>
          <label>Application deadline <input id="jobDeadline" name="deadline" type="date"></label>
          <label>Stage
            <select id="jobStage" name="stage">
              <option value="saved">Saved</option><option value="applied">Applied</option>
              <option value="interview">Interview</option><option value="closed">Offered/Rejected</option>
            </select>
          </label>
        </div>
        <p id="formHint" class="form-hint">Detected details are editable before saving.</p>
        <div class="form-actions">
          <button id="cancelFormButton" class="button button-secondary" type="button">Cancel</button>
          <button id="saveJobButton" class="button button-primary" type="submit">Save job</button>
        </div>
      </form>
    </section>
    <section id="board" class="board" aria-label="Job application board">
      <div class="column" data-stage="saved">
        <header class="column-header"><span class="stage-dot dot-saved"></span><h2>Saved</h2><span class="column-count">0</span></header>
        <div class="card-list" data-drop-stage="saved"></div>
      </div>
      <div class="column" data-stage="applied">
        <header class="column-header"><span class="stage-dot dot-applied"></span><h2>Applied</h2><span class="column-count">0</span></header>
        <div class="card-list" data-drop-stage="applied"></div>
      </div>
      <div class="column" data-stage="interview">
        <header class="column-header"><span class="stage-dot dot-interview"></span><h2>Interview</h2><span class="column-count">0</span></header>
        <div class="card-list" data-drop-stage="interview"></div>
      </div>
      <div class="column" data-stage="closed">
        <header class="column-header"><span class="stage-dot dot-closed"></span><h2>Offered/Rejected</h2><span class="column-count">0</span></header>
        <div class="card-list" data-drop-stage="closed"></div>
      </div>
    </section>
    <footer><span>Saved privately on this device</span><span id="jobTotal">0 jobs</span></footer>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </main>
</body>
</html>
